# SonarCloud Automatic Analysis configuration.
# Automatic Analysis reads this file (not sonar-project.properties, which is
# only used by the CI-based scanner in the disabled sonar.yml workflow).

# run-tests.sh is a local/CI dev convenience script that installs dependencies
# only from our own committed lockfiles (poetry.lock / pnpm-lock.yaml). Its
# poetry/pnpm invocations trip the package-manager security rules (S8541) even
# with --no-root/--no-directory, and removing them breaks the Integration job.
# Exclude the script from analysis.
sonar.exclusions=run-tests.sh
