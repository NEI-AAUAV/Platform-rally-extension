# Self-contained load-test stack: Postgres + Redis + fake OIDC + api-rally
# (production-like: 4 workers, no --reload) + k6.
#
#   make load-test                       # PROFILE=load (10 min)
#   make load-test PROFILE=smoke         # 90 s sanity run
#   make load-test PROFILE=stress        # aggressive think times, 250 rps spike
#
# k6 sits on a fixed address that api-rally trusts as a reverse proxy, so
# each simulated phone's X-Forwarded-For is honoured and the per-IP rate
# limits behave exactly as behind the production proxy.

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rally_load
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [load]

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [load]

  fake-oidc:
    build:
      context: ../api-rally
      dockerfile: Dockerfile
    working_dir: /api_rally
    volumes:
      - ../api-rally/scripts:/api_rally/scripts:ro
    command: ["poetry", "run", "python", "scripts/smoke/fake_oidc_provider.py"]
    environment:
      FAKE_OIDC_ISSUER: http://fake-oidc:9009
      FAKE_OIDC_CLIENT_ID: rally-load-client
      # Long enough for the soak profile.
      FAKE_OIDC_TOKEN_TTL_SECONDS: "14400"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9009/jwks')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [load]

  api:
    build:
      context: ../api-rally
      dockerfile: Dockerfile
    command: ["poetry", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--workers", "${API_WORKERS:-4}"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fake-oidc: { condition: service_healthy }
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rally_load
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EVENTS_ENABLED: "true"
      EVENTS_FAIL_SILENTLY: "true"
      RECOMPUTE_OFF_PATH: ${RECOMPUTE_OFF_PATH:-false}
      OIDC_PROVIDER_URL: http://fake-oidc:9009
      OIDC_CLIENT_ID: rally-load-client
      OIDC_APPLICATION_SLUG: rally
      TEAM_JWT_SECRET_KEY: load-test-only-secret-not-for-prod
      SELF_CHECKIN_ENABLED: "true"
      TRUSTED_PROXIES: '["172.31.0.50"]'
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      LOG_LEVEL: WARNING
      METRICS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${LOAD_API_HOST_PORT:-8013}:8003"
    networks: [load]

  k6:
    image: grafana/k6:1.3.0
    depends_on:
      api: { condition: service_healthy }
    working_dir: /work
    volumes:
      - ./k6:/work/loadtest/k6:ro
      - ./results:/work/loadtest/results
    environment:
      API_URL: http://api:8003
      OIDC_URL: http://fake-oidc:9009
      PROFILE: ${PROFILE:-load}
      DURATION: ${DURATION:-}
      TEAMS: ${TEAMS:-30}
      MEMBERS_PER_TEAM: ${MEMBERS_PER_TEAM:-5}
      CHECKPOINTS: ${CHECKPOINTS:-8}
      SCENARIOS: ${SCENARIOS:-}
    command:
      - run
      - --summary-export=loadtest/results/summary-${PROFILE:-load}.json
      - --out=csv=loadtest/results/raw-${PROFILE:-load}.csv.gz
      - loadtest/k6/rally.js
    networks:
      load:
        ipv4_address: 172.31.0.50

networks:
  load:
    ipam:
      config:
        - subnet: 172.31.0.0/24
