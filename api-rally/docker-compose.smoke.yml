services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rally_smoke
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2026-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2026-08-01T01-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/rally-smoke || true && mc anonymous set download local/rally-smoke",
      ]

  fake-oidc:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /api_rally
    volumes:
      - ./scripts:/api_rally/scripts:ro
    command: ["poetry", "run", "python", "scripts/smoke/fake_oidc_provider.py"]
    ports:
      - "9009:9009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9009/jwks')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Overrides the image's dev CMD (uvicorn --reload, single worker): the
    # fullstack e2e suite's rally-day.spec.ts drives 7 concurrent browser
    # contexts hammering the API at once, and a single --reload worker
    # couldn't keep up — every fullstack test queued after it in the same
    # Playwright worker then failed with a generic Node "fetch failed"
    # (connection refused/reset) once the process fell behind. --reload
    # also re-execs the process on every file it touches, which is pure
    # overhead in a container that never has its source hot-swapped.
    command:
      [
        "poetry", "run", "uvicorn", "app.main:app",
        "--host", "0.0.0.0", "--port", "8003",
        "--workers", "4",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fake-oidc:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rally_smoke
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OIDC_PROVIDER_URL: http://fake-oidc:9009
      OIDC_CLIENT_ID: rally-smoke-client
      OIDC_APPLICATION_SLUG: rally
      R2_ENDPOINT_URL: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: rally-smoke
      R2_PUBLIC_BASE_URL: http://localhost:9000/rally-smoke
      TEAM_JWT_SECRET_KEY: smoke-only-secret-not-for-prod
      # VAPID keys are a real EC keypair, so they are never committed — not even
      # throwaway ones. Source them from the environment (compose reads an
      # adjacent, git-ignored .env; CI generates a fresh pair per run) and fail
      # fast when absent. See .env.example.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY (see api-rally/.env.example)}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY (see api-rally/.env.example)}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:smoke-tests@example.invalid}
      EVENTS_ENABLED: "true"
      EVENTS_FAIL_SILENTLY: "false"
      SELF_CHECKIN_ENABLED: "true"
      # Production default (10/5min) is tuned for brute-force abuse
      # prevention, not test load — several e2e-fullstack specs each mint a
      # real team login against this one shared IP in a single suite run
      # (golden-path, guide-and-badges, multi-edicao, master-rally-day,
      # security-abac, rally-day), so the production limit gets legitimately
      # exhausted mid-suite and later logins 429 with no attacker involved.
      # Raised here only, not in the app's own default.
      TEAM_LOGIN_RATE_LIMIT_ATTEMPTS: "200"
      # 4 uvicorn workers each open their own SQLAlchemy pool
      # (DB_POOL_SIZE + DB_MAX_OVERFLOW); keep per-worker pools small so the
      # aggregate stays comfortably under Postgres's default 100-connection
      # limit while still giving rally-day's concurrent bursts headroom.
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "10"
    ports:
      - "${SMOKE_API_HOST_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/docs')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /api_rally
    volumes:
      - ./scripts:/api_rally/scripts:ro
    command: ["poetry", "run", "python", "scripts/smoke/run_smoke.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      SMOKE_API_BASE_URL: http://api:8003
      OIDC_PROVIDER_URL: http://fake-oidc:9009
