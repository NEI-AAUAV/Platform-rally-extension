services:
  postgres:
    # Mirrored from Docker Hub via AWS's public ECR: anonymous Docker Hub
    # pulls on shared GitHub runner IPs intermittently fail the smoke stack
    # with "unauthorized: authentication required" once the shared rate
    # limit is exhausted. public.ecr.aws serves the same official images
    # with no auth and no pull limit.
    image: public.ecr.aws/docker/library/postgres:15
    environment:
      POSTGRES_USER: ${SMOKE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SMOKE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: rally_smoke
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO no longer publishes community images: quay.io/minio/{minio,mc} now
  # answer anonymous pulls with "unauthorized" and Docker Hub's minio/* repos
  # deny access, so the previously pinned RELEASE.2025-* tags are simply
  # unpullable (retrying cannot help). Chainguard rebuilds MinIO and mc from
  # upstream source and serves them from cgr.dev with no auth and no pull
  # limit. Their free tier only tags :latest / :latest-dev, so both are pinned
  # by digest to keep CI reproducible — bump the digest deliberately.
  # The image runs as a non-root user and ships bash but not curl/grep, hence the
  # /dev/tcp healthcheck; it runs as root so it can write the fresh /data
  # volume (throwaway CI container).
  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SMOKE_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SMOKE_MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # :latest-dev is the variant with a shell, needed to chain the mc calls.
    image: cgr.dev/chainguard/minio-client@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 \"${SMOKE_MINIO_USER:-minioadmin}\" \"${SMOKE_MINIO_PASSWORD:-minioadmin}\" && mc mb -p local/rally-smoke || true && mc anonymous set download local/rally-smoke",
      ]

  fake-oidc:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /api_rally
    volumes:
      - ./scripts:/api_rally/scripts:ro
    command: ["poetry", "run", "python", "scripts/smoke/fake_oidc_provider.py"]
    ports:
      - "9009:9009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9009/jwks')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Overrides the image's dev CMD (uvicorn --reload, single worker): the
    # fullstack e2e suite's rally-day.spec.ts drives 7 concurrent browser
    # contexts hammering the API at once, and a single --reload worker
    # couldn't keep up — every fullstack test queued after it in the same
    # Playwright worker then failed with a generic Node "fetch failed"
    # (connection refused/reset) once the process fell behind. --reload
    # also re-execs the process on every file it touches, which is pure
    # overhead in a container that never has its source hot-swapped.
    command:
      [
        "poetry", "run", "uvicorn", "app.main:app",
        "--host", "0.0.0.0", "--port", "8003",
        "--workers", "4",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fake-oidc:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${SMOKE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SMOKE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: rally_smoke
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OIDC_PROVIDER_URL: http://fake-oidc:9009
      OIDC_CLIENT_ID: rally-smoke-client
      OIDC_APPLICATION_SLUG: rally
      R2_ENDPOINT_URL: http://minio:9000
      R2_ACCESS_KEY_ID: ${SMOKE_MINIO_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${SMOKE_MINIO_PASSWORD:-minioadmin}
      R2_BUCKET: rally-smoke
      R2_PUBLIC_BASE_URL: http://localhost:9000/rally-smoke
      TEAM_JWT_SECRET_KEY: ${SMOKE_TEAM_JWT_SECRET_KEY:-smoke-only-secret-not-for-prod}
      # VAPID keys are a real EC keypair, so they are never committed — not even
      # throwaway ones. Source them from the environment (compose reads an
      # adjacent, git-ignored .env; CI generates a fresh pair per run) and fail
      # fast when absent. See .env.example.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY (see api-rally/.env.example)}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY (see api-rally/.env.example)}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:smoke-tests@example.invalid}
      EVENTS_ENABLED: "true"
      EVENTS_FAIL_SILENTLY: "false"
      SELF_CHECKIN_ENABLED: "true"
      # Production default (10/5min) is tuned for brute-force abuse
      # prevention, not test load — several e2e-fullstack specs each mint a
      # real team login against this one shared IP in a single suite run
      # (golden-path, guide-and-badges, multi-edicao, master-rally-day,
      # security-abac, rally-day), so the production limit gets legitimately
      # exhausted mid-suite and later logins 429 with no attacker involved.
      # Raised here only, not in the app's own default.
      TEAM_LOGIN_RATE_LIMIT_ATTEMPTS: "200"
      # 4 uvicorn workers each open their own SQLAlchemy pool
      # (DB_POOL_SIZE + DB_MAX_OVERFLOW); keep per-worker pools small so the
      # aggregate stays comfortably under Postgres's default 100-connection
      # limit while still giving rally-day's concurrent bursts headroom.
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "10"
    ports:
      - "${SMOKE_API_HOST_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/docs')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  smoke:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /api_rally
    volumes:
      - ./scripts:/api_rally/scripts:ro
    command: ["poetry", "run", "python", "scripts/smoke/run_smoke.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      SMOKE_API_BASE_URL: http://api:8003
      OIDC_PROVIDER_URL: http://fake-oidc:9009
