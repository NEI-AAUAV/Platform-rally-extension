# Alembic configuration for api-rally.
#
# The database URL is built from application settings in alembic/env.py, so it
# is intentionally not set here (no secrets in the repo). Run migrations with:
#   alembic upgrade head
# On a database already created by the legacy create_all bootstrap, adopt
# alembic once with:
#   alembic stamp head

[alembic]
script_location = alembic
prepend_sys_path = .
# Versioned migration files: NNNN_slug.py
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
