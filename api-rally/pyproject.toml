[tool.poetry]
name = "api-rally"
version = "0.1.0"
description = "Rally Tascas Service"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
SQLAlchemy = {version = "^2.0.51", extras = ["asyncio"]}
pydantic = "^2.13.4"
loguru = "^0.7.3"
python-multipart = "^0.0.32"
fastapi = "0.139.2"
python-jose = "^3.5.0"
psycopg2-binary = "^2.9.12"
asyncpg = "^0.31.0"
pydantic-settings = "^2.14.2"
orjson = "^3.11.9"
aiocache = "^0.12.3"
alembic = "^1.18.5"
h11 = ">=0.16.0"
boto3 = "^1.43.55"
authlib = "^1.3.0"
httpx = "0.28.1"
redis = "^8.0.1"
greenlet = "^3.5.4"
sentry-sdk = {version = "^2.66.1", extras = ["fastapi"]}
openpyxl = "^3.1.5"
boto3-stubs = "~=1.43.55"
botocore = "^1.43.55"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^2.3.0"
uvicorn = "^0.51.0"
types-python-jose = "^3.5.0.20260408"
types-passlib = "^1.7.7.20260211"
black = "^26.5.1"
safety = "^3.2.0"


[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
requests = "^2.34.2"
psycopg2-binary = "^2.9.12"
aiosqlite = "^0.22.1"
fakeredis = "^2.26.0"
hypothesis = "^6.140.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.mypy]
exclude = ["app/tests"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "aiocache.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.schema"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "authlib.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.main"
ignore_errors = true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
