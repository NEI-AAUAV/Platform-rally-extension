[pytest]
minversion = 7.0
# --cov-fail-under is deliberately absent here: CI shards each run a slice of
# the suite (see .github/workflows/tests.yml), so a per-shard coverage number
# is meaningless and would fail spuriously. The 80% floor is enforced once,
# against combined coverage, by the test-api-coverage job.
addopts = -ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=html:coverage --cov-report=xml:coverage.xml --junitxml=test-results.xml
asyncio_mode = auto
testpaths = app/tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning