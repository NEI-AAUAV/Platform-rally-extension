# Staging Rally Tascas stack — self-contained pre-production environment.
#
# Mirrors deploy/docker-compose.prod.yaml (same GHCR images) but bundles its
# own nginx instead of relying on the VM-level reverse proxy, and uses an
# internal bridge network instead of the shared external `rally_network`. This
# lets a full stack run in isolation to validate a release (e.g. OIDC against
# authentik) before promoting the same images to prod.
#
# Driven with .env.staging. Project name: nei-rally-staging.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${STAGING_PORT:-80}:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api_rally:
        condition: service_healthy
      web_rally:
        condition: service_started

  web_rally:
    image: ghcr.io/nei-aauav/rally/web:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api_rally:
        condition: service_healthy

  api_rally:
    image: ghcr.io/nei-aauav/rally/api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - ENV=staging
      # Redis (realtime subsystem). Inert unless EVENTS_ENABLED=true.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EVENTS_ENABLED=${EVENTS_ENABLED:-false}
      # OIDC resource-server validation (authentik)
      - OIDC_PROVIDER_URL=${OIDC_PROVIDER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_APPLICATION_SLUG=${OIDC_APPLICATION_SLUG}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP}
      - OIDC_MANAGER_GROUP=${OIDC_MANAGER_GROUP}
      - OIDC_STAFF_GROUP=${OIDC_STAFF_GROUP}
      # Team auth (rally-minted HS256 tokens)
      - TEAM_JWT_SECRET_KEY=${TEAM_JWT_SECRET_KEY}
      # CORS
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      # Cloudflare R2 (branding uploads)
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - rally_staging_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  rally_staging_db_data:
    driver: local
