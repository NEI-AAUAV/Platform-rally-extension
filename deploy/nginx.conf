# Standalone Rally Tascas reverse proxy.
# Serves the SPA under /rally and the API/static under /api/rally and
# /static/rally — the same path prefixes the app already uses, so no client
# changes are needed when running independently of the NEI Platform.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS, so recreated containers are re-resolved.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # API + static assets → api-rally
        location ~ ^/(api|static)/rally(/.*)?$ {
            limit_except GET POST PUT PATCH DELETE OPTIONS {
                deny all;
            }
            set $rally_api api_rally;
            proxy_pass http://$rally_api:8003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # SPA → web-rally
        location ~ ^/rally(/.*)?$ {
            set $rally_web web_rally;
            proxy_pass http://$rally_web:3003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Convenience redirect: root → the app.
        location = / {
            return 301 /rally/;
        }
    }
}
