# Rally Tascas — bundled staging nginx (server block).
#
# Loaded as /etc/nginx/conf.d/default.conf by the nginx service in
# deploy/docker-compose.staging.yaml. Routes the same /rally and /api/rally
# prefixes the app already uses, proxying to the prod-image service names on
# the staging compose network.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, so recreated containers are re-resolved.
    resolver 127.0.0.11 valid=10s;

    # API + static assets → api-rally
    location ~ ^/(api|static)/rally(/.*)?$ {
        set $rally_api api_rally;
        proxy_pass http://$rally_api:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA → web-rally
    location ~ ^/rally(/.*)?$ {
        set $rally_web web_rally;
        proxy_pass http://$rally_web:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Convenience redirect: root → the app.
    location = / {
        return 301 /rally/;
    }
}
