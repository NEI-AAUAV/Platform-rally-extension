# Rally Tascas — VM-level nginx location blocks (production).
# Include inside the main server block on the NEI VM.
#
# Requires the external `rally_network` Docker network shared with the prod
# stack (deploy/docker-compose.prod.yaml). Service aliases on that network:
#   rally-web (:3003)  rally-api (:8003)
#
# Uses Docker's embedded resolver (127.0.0.11) with variables in proxy_pass so
# recreated containers are re-resolved on deploy.

location /rally {
    resolver 127.0.0.11 valid=10s;
    set $rally_web rally-web;
    proxy_pass http://$rally_web:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ~ ^/(api|static)/rally(/.*)?$ {
    resolver 127.0.0.11 valid=10s;
    set $rally_api rally-api;
    proxy_pass http://$rally_api:8003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
