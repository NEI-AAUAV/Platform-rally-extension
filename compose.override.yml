services:
  # Publish the dev Postgres on the host (dev-only) so local test runs can
  # reuse it instead of spinning a throwaway container:
  #   RALLY_TEST_PG=external POSTGRES_SERVER=localhost ./run-tests.sh
  db_pg:
    ports:
      - "5432:5432"

  web_nei:
    environment:
      ENABLE_RALLY: 'True'

  # Ephemeral cache / pub-sub broker for the rally realtime, rate-limit and
  # idempotency subsystems. No persistence: all state is recomputable from
  # Postgres. Redis failures degrade silently (EVENTS_FAIL_SILENTLY).
  rally_redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  api_rally:
    build:
      context: extensions/rally/api-rally
    ports:
      - 8003:8003
    environment:
      POSTGRES_SERVER: db_pg
      POSTGRES_PASSWORD: postgres
      JWT_PUBLIC_KEY_PATH: /jwt.key.pub
      TEAM_JWT_SECRET_KEY: ${TEAM_JWT_SECRET_KEY:-dev_secret_key_change_me_in_production_12345}
      SELF_CHECKIN_ENABLED: ${SELF_CHECKIN_ENABLED:-true}
      CHECKIN_HMAC_SECRET: ${CHECKIN_HMAC_SECRET:-}
      CHECKIN_TOKEN_TTL_SECONDS: ${CHECKIN_TOKEN_TTL_SECONDS:-90}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      REDIS_HOST: ${REDIS_HOST:-rally_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Staff auth: rally is a pure OIDC resource server (validates tokens via
      # JWKS discovery). Dedicated 'rally' authentik app; no client secret.
      OIDC_PROVIDER_URL: ${RALLY_OIDC_PROVIDER_URL:?set RALLY_OIDC_PROVIDER_URL in .env}
      OIDC_APPLICATION_SLUG: ${RALLY_OIDC_APPLICATION_SLUG:-rally}
      OIDC_CLIENT_ID: ${RALLY_OIDC_CLIENT_ID:?set RALLY_OIDC_CLIENT_ID in .env}
      # Role mapping from authentik group names (NEI convention).
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-nei-admin}
      OIDC_MANAGER_GROUP: ${OIDC_MANAGER_GROUP:-nei-manager-rally}
      OIDC_STAFF_GROUP: ${OIDC_STAFF_GROUP:-nei-rally-staff}
      OIDC_GUIDE_GROUP: ${OIDC_GUIDE_GROUP:-nei-rally-guide}
    volumes:
      - ./extensions/rally/api-rally:/api_rally
      - ./dev-keys/jwt.key.pub:/jwt.key.pub:ro
    depends_on:
      db_pg:
        condition: service_healthy
      rally_redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  web_rally:
    build:
      context: extensions/rally/web-rally
    ports:
      - 3003:3003
    environment:
      # Staff auth: authentik PKCE login (public client). Vite reads VITE_* at
      # dev-server start, so recreate this service after changing them.
      VITE_OIDC_AUTHORITY: ${RALLY_OIDC_AUTHORITY:?set RALLY_OIDC_AUTHORITY in .env}
      VITE_OIDC_CLIENT_ID: ${RALLY_OIDC_CLIENT_ID:?set RALLY_OIDC_CLIENT_ID in .env}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost/rally/auth/callback}
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost/rally/}
      VITE_OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-nei-admin}
      VITE_OIDC_MANAGER_GROUP: ${OIDC_MANAGER_GROUP:-nei-manager-rally}
      VITE_OIDC_STAFF_GROUP: ${OIDC_STAFF_GROUP:-nei-rally-staff}
      VITE_OIDC_GUIDE_GROUP: ${OIDC_GUIDE_GROUP:-nei-rally-guide}
      VITE_EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
    volumes:
      - rally_pnpm_store:/pnpm
      - ./extensions/rally/web-rally:/web_rally
      - rally_modules:/web_rally/node_modules
    networks:
      - frontend
    restart: unless-stopped

  proxy:
    volumes:
      - ./dev/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dev/proxy/locations.conf:/etc/nginx/conf.d/locations.conf:ro
      - ./dev/proxy/locations.rally.conf:/etc/nginx/conf.d/locations.rally.conf:ro
    depends_on:
      - api_rally
      - web_rally

volumes:
  rally_pnpm_store:
    driver: local
  rally_modules:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
