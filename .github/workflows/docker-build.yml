name: Docker Build Validation

# Validation only builds images (push: false); read access is sufficient.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'api-rally/Dockerfile*'
      - 'web-rally/Dockerfile*'
      - 'api-rally/pyproject.toml'
      - 'api-rally/poetry.lock'
      - 'web-rally/package.json'
      - 'web-rally/pnpm-lock.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api-rally/Dockerfile*'
      - 'web-rally/Dockerfile*'
  workflow_dispatch:

jobs:
  build-api-docker:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API development image
        uses: docker/build-push-action@v7
        with:
          context: ./api-rally
          file: ./api-rally/Dockerfile
          push: false
          load: true
          tags: rally-api:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build API production image
        uses: docker/build-push-action@v7
        with:
          context: ./api-rally
          file: ./api-rally/Dockerfile.prod
          push: false
          tags: rally-api:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Smoke-test API image
        run: |
          echo "🔎 Running lightweight smoke test (compile Python sources)..."
          docker run --rm rally-api:dev poetry run python -m compileall app
          echo "✅ API image passed smoke test"

  build-web-docker:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build web development image
        uses: docker/build-push-action@v7
        with:
          context: ./web-rally
          file: ./web-rally/Dockerfile
          push: false
          load: true
          tags: rally-web:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build web production image
        uses: docker/build-push-action@v7
        with:
          # Context must be repo root for multi-stage build
          # (Stage 1 needs api-rally/ to generate OpenAPI schema)
          context: .
          file: ./web-rally/Dockerfile.prod
          push: false
          tags: rally-web:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test web container responds
        run: |
          echo "🚀 Starting web dev container..."
          docker run -d --name rally-web-test -p 3003:3003 rally-web:dev
          
          echo "⏳ Waiting for Vite dev server to start..."
          for i in {1..6}; do
            if docker ps --filter "name=rally-web-test" --filter "status=running" | grep -q rally-web-test; then
              if curl -sSf --max-time 10 http://localhost:3003 >/dev/null; then
                echo "✅ Web server is responding"
                docker stop rally-web-test >/dev/null
                docker rm -f rally-web-test >/dev/null
                exit 0
              fi
            else
              echo "🚨 Container exited early"
              break
            fi
            echo "Still waiting... ($i/6)"
            sleep 10
          done
          
          echo "❌ Web server not responding"
          echo "Container logs:"
          docker logs --tail=200 rally-web-test || true
          docker rm -f rally-web-test || true
          exit 1

  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate compose files
        env:
          # Placeholders so interpolation resolves; `config` does not run anything.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rally
        run: |
          set -e
          for f in compose.yml deploy/docker-compose.prod.yaml deploy/docker-compose.staging.yaml; do
            echo "Validating $f..."
            docker compose -f "$f" config -q
            echo "✅ $f is valid"
          done

