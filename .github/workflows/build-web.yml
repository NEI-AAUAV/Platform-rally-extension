name: Build Rally Web Extension

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  POETRY_INSTALLER_ONLY_BINARY: ":all:"
  # http-ece (pywebpush dep) publishes no wheels; exact-name no-binary overrides :all: for it only
  POETRY_INSTALLER_NO_BINARY: "http-ece"

jobs:
  build-web-rally:
    name: Build Rally Web Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Prepare Python environment to generate OpenAPI schema offline (no DB)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          # 2.4.x is required: older chooser versions ignore an exact-name
          # no-binary entry when only-binary is :all: (needed for http-ece).
          pip install --only-binary :all: poetry==2.4.1
        shell: bash

      - name: Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('api-rally/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install API dependencies
        working-directory: api-rally
        run: |
          poetry config installer.only-binary :all:
          poetry config installer.no-binary http-ece
          poetry install --no-interaction --no-root

      - name: Generate OpenAPI schema (offline)
        working-directory: api-rally
        run: poetry run python scripts/generate_openapi.py
        env:
          TEAM_JWT_SECRET_KEY: test_secret
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          # Use package.json as fallback when lockfile may be missing
          key: ${{ runner.os }}-pnpm-store-rally-${{ hashFiles('web-rally/pnpm-lock.yaml', 'web-rally/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-rally-
      
      - name: Install dependencies
        working-directory: web-rally
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate API client
        working-directory: web-rally
        run: pnpm run generate-client
      
      - name: Build web-rally
        working-directory: web-rally
        env:
          GENERATE_SOURCEMAP: false
        run: pnpm build
        
      - name: Verify build artifacts
        working-directory: web-rally
        run: |
          echo "📦 Verifying build artifacts..."
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: Build directory 'dist' was not created"
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "❌ ERROR: Build directory 'dist' is empty"
            exit 1
          fi
          echo "✅ Build successful - dist directory contains files"
          echo "📊 Dist contents:"
          du -sh dist
          find dist -type f | head -20

      # Installability, launcher theming and Android link capturing all fail
      # silently: the app still builds and loads, it just stops behaving like an
      # installed app. This asserts the manifest, the service worker and the
      # viewport/theme-color meta tags that carry that behaviour.
      - name: Verify PWA surface
        working-directory: web-rally
        run: pnpm run verify:pwa

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-rally-dist-${{ github.sha }}
          path: web-rally/dist
          if-no-files-found: error
