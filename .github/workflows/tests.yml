name: Rally Extension Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'api-rally/**'
      - 'web-rally/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api-rally/**'
      - 'web-rally/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - api
        - frontend
        - integration
      coverage:
        description: 'Generate coverage reports'
        required: false
        default: true
        type: boolean

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'api' || github.event.inputs.test_type == '' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        
    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: api-rally/.venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      working-directory: api-rally
      run: |
        poetry install --no-interaction --no-root
        
    - name: Create test database
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        PGPASSWORD=postgres psql -h localhost -U postgres -d postgres_test -c "CREATE DATABASE postgres_test_test;" || echo "Database might already exist"
      env:
        POSTGRES_SERVER: localhost
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres_test
        
    - name: Run API tests
      working-directory: api-rally
      run: |
        if [ "${{ github.event.inputs.coverage }}" = "true" ] || [ "${{ github.event.inputs.coverage }}" = "" ]; then
          poetry run pytest app/tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term --junitxml=test-results.xml
        else
          poetry run pytest app/tests/ -v --junitxml=test-results.xml
        fi
      env:
        POSTGRES_SERVER: localhost
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres_test
        TEAM_JWT_SECRET_KEY: test_secret

    - name: Enforce scoring/badges coverage floor
      # The global 80% gate lets low coverage in the scoring/badge engine hide
      # behind well-covered code elsewhere. These modules decide every point on
      # the leaderboard, so they get a dedicated, higher floor. Reuses the
      # .coverage data written by the run above (no re-run).
      if: ${{ github.event.inputs.coverage == 'true' || github.event.inputs.coverage == '' }}
      working-directory: api-rally
      run: |
        poetry run coverage report --fail-under=85 --include="\
        app/services/scoring_service.py,\
        app/services/badge_service.py,\
        app/badges/evaluators.py,\
        app/badges/triggers.py,\
        app/workers/worker_scoring.py,\
        app/workers/worker_badges.py"

    - name: Upload API test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: api-test-results
        path: |
          api-rally/test-results.xml
          api-rally/coverage/

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'frontend' || github.event.inputs.test_type == '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install API dependencies
      working-directory: api-rally
      run: |
        poetry install --no-interaction --no-root

    - name: Generate OpenAPI schema (offline)
      working-directory: api-rally
      run: poetry run python scripts/generate_openapi.py
      env:
        TEAM_JWT_SECRET_KEY: test_secret

    - name: Set up pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: web-rally/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: web-rally
      run: pnpm install --frozen-lockfile

    - name: Generate API client
      working-directory: web-rally
      run: pnpm run generate-client

    - name: Run frontend tests
      working-directory: web-rally
      run: |
        if [ "${{ github.event.inputs.coverage }}" = "true" ] || [ "${{ github.event.inputs.coverage }}" = "" ]; then
          pnpm exec vitest run --coverage --reporter=verbose
        else
          pnpm exec vitest run --reporter=verbose
        fi

    - name: Upload frontend test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: frontend-test-results
        path: |
          web-rally/coverage/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-api, test-frontend]
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'integration' || github.event.inputs.test_type == '' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        
    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        
    - name: Install API dependencies
      working-directory: api-rally
      run: |
        poetry install --no-interaction --no-root

    - name: Set up pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: web-rally/pnpm-lock.yaml

    - name: Install frontend dependencies
      working-directory: web-rally
      run: pnpm install --frozen-lockfile

    - name: Generate OpenAPI schema
      working-directory: api-rally
      run: poetry run python scripts/generate_openapi.py
      env:
        TEAM_JWT_SECRET_KEY: test_secret

    - name: Download API test results
      uses: actions/download-artifact@v8
      with:
        name: api-test-results
        path: api-rally/

    - name: Download frontend test results
      uses: actions/download-artifact@v8
      with:
        name: frontend-test-results
        path: web-rally/coverage/

    - name: Create test database
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        PGPASSWORD=postgres psql -h localhost -U postgres -d postgres_test -c "CREATE DATABASE postgres_test_test;" || echo "Database might already exist"
      env:
        POSTGRES_SERVER: localhost
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres_test

    - name: Run integration tests
      run: |
        chmod +x run-tests.sh
        ./run-tests.sh
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres_test
        POSTGRES_SERVER: localhost
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres_test
        TEAM_JWT_SECRET_KEY: test_secret

    - name: Upload integration test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: integration-test-results
        path: |
          api-rally/test-results.xml
          api-rally/coverage/
          web-rally/coverage/
