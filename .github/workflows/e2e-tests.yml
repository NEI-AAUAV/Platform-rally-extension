name: E2E Tests (Playwright)

permissions:
  contents: read

env:
  POETRY_INSTALLER_ONLY_BINARY: ":all:"

on:
  push:
    branches: [ main ]
    paths:
      - 'web-rally/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'web-rally/**'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install API dependencies
        working-directory: api-rally
        run: poetry install --no-interaction --no-root
      
      - name: Generate OpenAPI schema
        working-directory: api-rally
        run: poetry run python scripts/generate_openapi.py
        env:
          TEAM_JWT_SECRET_KEY: test_secret
      
      - name: Start smoke stack (postgres, redis, fake-oidc, api)
        working-directory: api-rally
        run: docker compose -f docker-compose.smoke.yml up -d postgres redis fake-oidc api

      - name: Wait for api-rally to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8003/docs > /dev/null; then
              echo "api-rally is up"
              exit 0
            fi
            sleep 2
          done
          echo "api-rally did not become healthy in time"
          docker compose -f api-rally/docker-compose.smoke.yml logs
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-e2e-${{ hashFiles('web-rally/pnpm-lock.yaml') }}                                                                               
          restore-keys: ${{ runner.os }}-pnpm-e2e-
      
      - name: Install dependencies
        working-directory: web-rally
        run: pnpm install --frozen-lockfile
      
      - name: Generate API client
        working-directory: web-rally
        run: pnpm run generate-client
      
      - name: Build web-rally
        working-directory: web-rally
        env:
          GENERATE_SOURCEMAP: false
        run: pnpm build
      
      - name: Install Playwright browsers
        working-directory: web-rally
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Run Playwright E2E tests
        working-directory: web-rally
        run: pnpm run test:e2e
        env:
          CI: true
      
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web-rally/playwright-report/
          retention-days: 7
      
      - name: Upload Playwright test videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-videos
          path: web-rally/test-results/
          retention-days: 7
      
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: web-rally/test-results/
          retention-days: 7

      - name: Stop smoke stack
        if: always()
        working-directory: api-rally
        run: docker compose -f docker-compose.smoke.yml down -v

