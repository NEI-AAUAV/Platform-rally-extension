name: E2E Tests (Playwright)

permissions:
  contents: read

env:
  POETRY_INSTALLER_ONLY_BINARY: ":all:"
  # http-ece (pywebpush dep) publishes no wheels; exact-name no-binary overrides :all: for it only
  POETRY_INSTALLER_NO_BINARY: "http-ece"

on:
  push:
    branches: [ main ]
    paths:
      - 'web-rally/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'web-rally/**'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Raised from 30 while the mocked suite's runtime here (~58 min, against
    # ~12 min for the same command in tests.yml) is being investigated.
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install API dependencies
        working-directory: api-rally
        run: poetry install --no-interaction --no-root
      
      - name: Generate OpenAPI schema
        working-directory: api-rally
        run: poetry run python scripts/generate_openapi.py
        env:
          TEAM_JWT_SECRET_KEY: test_secret
      
      - name: Start smoke stack (postgres, redis, fake-oidc, api)
        working-directory: api-rally
        run: docker compose -f docker-compose.smoke.yml up -d postgres redis fake-oidc api

      - name: Wait for api-rally to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8003/docs > /dev/null; then
              echo "api-rally is up"
              exit 0
            fi
            sleep 2
          done
          echo "api-rally did not become healthy in time"
          docker compose -f api-rally/docker-compose.smoke.yml logs
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
      
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-e2e-${{ hashFiles('web-rally/pnpm-lock.yaml') }}                                                                               
          restore-keys: ${{ runner.os }}-pnpm-e2e-
      
      - name: Install dependencies
        working-directory: web-rally
        run: pnpm install --frozen-lockfile --ignore-scripts
      
      - name: Generate API client
        working-directory: web-rally
        run: pnpm run generate-client
      
      - name: Build web-rally
        working-directory: web-rally
        env:
          GENERATE_SOURCEMAP: false
        run: pnpm build
      
      - name: Install Playwright browsers
        working-directory: web-rally
        run: pnpm run playwright:install
      
      # The same mocked command takes ~12 min in tests.yml but ~58 min here,
      # where the smoke stack is running alongside it. Record the machine size
      # and what the containers are consuming so the gap can be attributed.
      - name: Record runner capacity and container load
        run: |
          echo "cores: $(nproc)"
          free -m
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}'

      # Split the same way tests.yml does, which runs these as two parallel
      # jobs finishing in ~12 min and ~4 min.
      # `--reporter=line` is what makes this measurable: the configured `html`
      # reporter prints nothing while running, so a killed step leaves no trace
      # of which specs were slow. GitHub timestamps every line.
      - name: Run mocked e2e suite (chromium + mobile)
        working-directory: web-rally
        run: pnpm run test:e2e --project=chromium --project=mobile --reporter=line,html
        env:
          CI: true

      - name: Container load after the mocked suite
        if: ${{ always() }}
        run: docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}'

      - name: Run fullstack e2e suite (real backend)
        working-directory: web-rally
        run: pnpm run test:e2e --project=fullstack --reporter=line,html
        env:
          CI: true
          FULLSTACK_OIDC_URL: http://localhost:9009
          FULLSTACK_API_BASE_URL: http://localhost:8003
          FULLSTACK_API_PROXY_TARGET: http://localhost:8003
      
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web-rally/playwright-report/
          retention-days: 7
      
      - name: Upload Playwright test videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-videos
          path: web-rally/test-results/
          retention-days: 7
      
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: web-rally/test-results/
          retention-days: 7

      - name: Stop smoke stack
        if: always()
        working-directory: api-rally
        run: docker compose -f docker-compose.smoke.yml down -v

