<!doctype html>
<html lang="pt-PT">
  <head>
    <base href="/rally/" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- viewport-fit=cover is required on iOS 26+: without it env(safe-area-inset-*)
         stays 0 and Safari paints solid gaps around the redesigned chrome. -->
    <!-- interactive-widget=resizes-content: Android Chrome otherwise pans the
         visual viewport over a fixed layout when the soft keyboard opens, which
         hides the bottom nav and any sticky submit button behind the keyboard.
         Resizing the layout viewport instead is the native behaviour. Ignored by
         Safari, so iOS is unaffected. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Apply the saved color mode before paint to avoid a flash. Must resolve
         the same way as colorModeContext.ts: the stored value may be "system",
         in which case the OS appearance wins. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("rally_color_mode");
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var m = pref;
          if (pref === "system") {
            if (!window.matchMedia) m = "dark";
            else m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.add(m);
          document.documentElement.style.colorScheme = m;
        } catch (e) {
          console.warn("Failed to apply stored color mode, defaulting to dark", e);
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Opt in to the translucent surfaces only on Apple platforms running
         Safari 26+, where they read as native. navigator.vendor is WebKit-only
         and survives a standalone launch, unlike the UA "Safari/Version"
         tokens; scroll-driven animations shipped in Safari 26.0, so the pair
         approximates "Apple, 26 or newer". Everywhere else the attribute is
         absent and the design is unchanged. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("rally_glass");
          if (pref !== "on" && pref !== "off") pref = "auto";
          var supported =
            window.CSS &&
            (CSS.supports("backdrop-filter", "blur(1px)") ||
              CSS.supports("-webkit-backdrop-filter", "blur(1px)"));
          var isApple26 =
            navigator.vendor === "Apple Computer, Inc." &&
            window.CSS &&
            CSS.supports("animation-timeline", "scroll()");
          var on = supported && (pref === "on" || (pref === "auto" && isApple26));
          if (on) document.documentElement.dataset.glass = "on";
        } catch (e) {
          console.warn("Failed to check glass styling preference", e);
        }
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- PWA Meta Tags -->
    <!-- Order matters: browsers that don't understand `media` keep the first,
         unconditional tag (previous behaviour). Chrome/Android picks the last
         matching one, so the status bar and the Android task-switcher header
         track the active colour mode instead of staying brand red. The two
         values are --background in light/dark (see global.css), which is what
         Safari 26 already samples from the page. applyThemeColorMeta() in
         src/lib/themeColor.ts overrides these at runtime when the user picks a
         mode manually, since `media` only follows the OS. -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d14" />
    <meta name="description" content="Rally Tascas - Competição de equipas do NEI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rally Tascas" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/rally/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/rally/AppImages/ios/152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/rally/icon-144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/rally/AppImages/ios/120.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/rally/AppImages/ios/114.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/rally/AppImages/ios/76.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/rally/AppImages/ios/72.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/rally/AppImages/ios/60.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/rally/AppImages/ios/57.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Rally Tascas - NEI" />
    <meta
      property="og:description"
      content="Competição de equipas do Núcleo de Estudantes de Informática"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/rally/icon-512.png" />

    <title>Rally Tascas - NEI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
